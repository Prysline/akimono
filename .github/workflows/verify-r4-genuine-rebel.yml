name: R4 genuine player rebellion acceptance

on:
  pull_request:
    paths:
      - 'modern/src/**'
      - 'modern/scripts/dev-local.mjs'
      - 'modern/tests/support/p3-genuine-v2-player.mjs'
      - 'modern/tests/support/r4-genuine-mission-recipe.mjs'
      - 'modern/tests/r4-genuine-mission-recipe.test.mjs'
      - 'modern/tests/acceptance/r4-genuine-rebel-closed-loop.test.mjs'
      - 'modern/tests/acceptance/r4-genuine-ring-inventory.test.mjs'
      - 'modern/tests/support/p3-high-forge.mjs'
      - 'modern/tests/r4-p3-pre-event-overlay.test.mjs'
      - 'modern/tests/r4-rebel-reviewed-runtime.test.mjs'
      - 'modern/tests/r4-source-rebel-now.test.mjs'
      - 'modern/tests/b50-period-same-state-chain.test.mjs'
      - 'modern/tests/r4-lord-*.test.mjs'
      - 'modern/tests/support/r4-lord-*.mjs'
      - 'modern/tests/r4-perl-hash-replay.test.mjs'
      - 'modern/tests/original-perl/**'
      - '.github/workflows/verify-r4-genuine-rebel.yml'

jobs:
  lord-fiscal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated lord fiscal source differential (not genuine player)
        working-directory: modern
        run: |
          node --test tests/r4-lord-inside-source.test.mjs tests/r4-lord-sale-tax-source.test.mjs tests/r4-lord-tax-policy-wire.test.mjs tests/r4-lord-fiscal-runtime.test.mjs
          node --test --test-name-pattern='R4 lord tax two-slice source differential' tests/r4-p3-pre-event-overlay.test.mjs
  genuine-rebel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Record actual checkout
        run: git log -1 --format='%H %T %P'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused external source and CAS regression (not full audit)
        working-directory: modern
        run: |
          node --test --test-name-pattern='(R4 (two-slice external source fixture|opt-in external CAS refuses|external receipt aggregates|residual natural sale)|full actual two-slice source prefix)' tests/r4-p3-pre-event-overlay.test.mjs
          node --test tests/r4-rebel-reviewed-runtime.test.mjs tests/r4-genuine-mission-recipe.test.mjs tests/r4-source-rebel-now.test.mjs tests/b50-period-same-state-chain.test.mjs tests/r4-perl-hash-replay.test.mjs
      - name: Run genuine player acceptance (no fixture or skip)
        working-directory: modern
        run: node --test tests/acceptance/r4-genuine-rebel-closed-loop.test.mjs tests/acceptance/r4-genuine-ring-inventory.test.mjs
  genuine-lord-fiscal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine player wins lordship and operates nonzero fiscal policy
        working-directory: modern
        env:
          AKIMONO_TEST_LORD_FISCAL: '1'
        run: node --test tests/acceptance/r4-genuine-rebel-closed-loop.test.mjs
