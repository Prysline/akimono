name: C audit - recurrent player boundaries
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  p5-c62-funds-observation:
    if: ${{ github.event.number == 26 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/r0-r1-unified-audit-20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact historical failed candidate
        uses: actions/checkout@v4
        with:
          ref: '66c8d962392c3b190511348dd2415bdcdd7f45df'
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkout and original test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p5-funds"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            git --version
            node --version
            perl -v
            uname -a
            cat /etc/os-release
            git hash-object modern/tests/p5-book-work-v2-player-http.test.mjs
            git hash-object modern/tests/support/p3-genuine-v2-player.mjs
            test "$(git rev-parse HEAD)" = '66c8d962392c3b190511348dd2415bdcdd7f45df'
            test "$(git rev-parse 'HEAD^{tree}')" = 'ffb00590203f90be092f6d5b15c80697a5bd5888'
            test "$(git hash-object modern/tests/p5-book-work-v2-player-http.test.mjs)" = '97a9b57a8f51f72643f363d3bc21370323428be9'
            test "$(git hash-object modern/tests/support/p3-genuine-v2-player.mjs)" = '547208190d5ec6d26af293e1ed0d0ded5f649a44'
            test -z "$(git status --porcelain)"
          } 2>&1 | tee "$RUNNER_TEMP/p5-funds/environment.log"
      - name: Run original P5 file without modifications
        id: original
        working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p5-funds"
          set +e
          node --test tests/p5-book-work-v2-player-http.test.mjs >"$out/original-stdout.log" 2>"$out/original-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" | tee "$out/original-exit.txt"
          cat "$out/original-stdout.log"
          cat "$out/original-stderr.log"
          exit "$status"
      - name: Observe funds in a separate fresh run (temporary diagnostic copy only)
        if: ${{ !cancelled() && (steps.original.outcome == 'success' || steps.original.outcome == 'failure') }}
        working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p5-funds"
          trace=tests/p5-audit-funds-observation.mjs
          test ! -e "$trace"
          trap 'rm -f "$trace"' EXIT
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const original='tests/p5-book-work-v2-player-http.test.mjs';
          let src=readFileSync(original,'utf8');
          function appendOnce(line,addition){
            if(src.split(line).length!==2)throw Error('diagnostic anchor not unique: '+line);
            src=src.replace(line,line+'\n'+addition);
          }
          appendOnce('let nonWorkFunds=100000,totalPaid=0,workFundedPurchase=null;',
            "  t.after(()=>t.diagnostic('P5_AUDIT_FINAL '+JSON.stringify({nonWorkFunds,totalPaid,workFundedPurchase,purchases,works})));");
          appendOnce('nonWorkFunds+=Math.max(0,r.state.shop.money-before.shops[0].money);',
            "      t.diagnostic('P5_AUDIT_TICK '+JSON.stringify({revision:r.state.world.revision,period:r.state.world.period.settledCount,before:before.shops[0].money,after:r.state.shop.money,nonWorkFunds,totalPaid,sourceTrace:r.state.shop.money>before.shops[0].money?r.details.sourceTrace:null}));");
          appendOnce('totalPaid+=d.totalPaid;',
            "      t.diagnostic('P5_AUDIT_BUY '+JSON.stringify({revision:r.state.world.revision,itemId:d.itemId,count:d.purchasedCount,paid:d.totalPaid,totalPaid,nonWorkFunds,before:old.money,after:after.money}));");
          appendOnce('nonWorkFunds+=Math.max(0,p.state.shop.money-beforeCareerMoney);',
            "  t.diagnostic('P5_AUDIT_CAREER '+JSON.stringify({before:beforeCareerMoney,after:p.state.shop.money,nonWorkFunds,totalPaid}));");
          appendOnce('  // Discard normally to avoid unnecessary stock/upkeep; no sale income.',"  t.diagnostic('P5_AUDIT_PRE_LOOP '+JSON.stringify({nonWorkFunds,totalPaid,workFundedPurchase,period:p.state.world.period.settledCount,money:p.state.shop.money,revision:p.state.world.revision,loopWillRun:totalPaid<=nonWorkFunds}));");
          // Add a pre-assertion diagnostic without removing or altering any assertion.
          const anchor="  assert.ok(workFundedPurchase,'real purchases must exceed all non-work funds');";
          if(src.split(anchor).length!==2)throw Error('proof anchor');
          src=src.replace(anchor,"  t.diagnostic('P5_AUDIT_PROOF '+JSON.stringify({nonWorkFunds,totalPaid,workFundedPurchase,period:p.state.world.period.settledCount,money:p.state.shop.money,revision:p.state.world.revision,works,purchases}));\n"+anchor);
          writeFileSync('tests/p5-audit-funds-observation.mjs',src,{flag:'wx'});
          NODE
          git diff --no-index -- tests/p5-book-work-v2-player-http.test.mjs "$trace" >"$out/diagnostic-only.diff" || test "$?" = 1
          cat "$out/diagnostic-only.diff"
          set +e
          node --test --test-name-pattern='P5 new player:' "$trace" >"$out/observation-stdout.log" 2>"$out/observation-stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" | tee "$out/observation-exit.txt"
          cat "$out/observation-stdout.log"
          cat "$out/observation-stderr.log"
          rm -f "$trace"
          test "$(git hash-object tests/p5-book-work-v2-player-http.test.mjs)" = '97a9b57a8f51f72643f363d3bc21370323428be9'
          test -z "$(git status --porcelain)"
          exit "$status"
      - name: Preserve original and observation outputs separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-funds-c62-66c8d96
          path: ${{ runner.temp }}/p5-funds/
          if-no-files-found: warn
          retention-days: 30

  p3-nayuta-d35-observation:
    if: ${{ github.event.number == 26 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/r0-r1-unified-audit-20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact D35 failed candidate
        uses: actions/checkout@v4
        with:
          ref: '26604deebf757cb85c0e52481d84f492a0449cd2'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate and untouched tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p3-nayuta"
          mkdir -p "$out"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            perl -v
            test "$(git rev-parse HEAD)" = '26604deebf757cb85c0e52481d84f492a0449cd2'
            test "$(git rev-parse 'HEAD^{tree}')" = '6b27acdf4f07ed900b78bd84573b52303d85aa7e'
            test "$(git hash-object modern/tests/p3-v2-cross-period-nayuta.test.mjs)" = '9372b12a733f3a754bd3d6aa5df407fe7f34db26'
            test "$(git hash-object modern/tests/support/p3-genuine-v2-player.mjs)" = '5cf787e6fefadaddeef48bd7d965dc4fca342df6'
            test "$(git hash-object modern/src/original-b41-playable-sale.mjs)" = '6776d13e0f449cd1849ed91ddedd9de06e516a4a'
            test -z "$(git status --porcelain)"
          } 2>&1 | tee "$out/environment.log"
      - name: Run original unchanged test
        id: original
        working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p3-nayuta"
          set +e
          node --test tests/p3-v2-cross-period-nayuta.test.mjs >"$out/original.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" | tee "$out/original-exit.txt"
          cat "$out/original.log"
          exit "$status"
      - name: Run separate diagnostic test and helper copies
        if: ${{ !cancelled() && (steps.original.outcome == 'success' || steps.original.outcome == 'failure') }}
        working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p3-nayuta"
          testcopy=tests/p3-audit-nayuta-observation.mjs
          helpercopy=tests/support/p3-audit-nayuta-player.mjs
          test ! -e "$testcopy" && test ! -e "$helpercopy"
          trap 'rm -f "$testcopy" "$helpercopy"' EXIT
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const test=readFileSync('tests/p3-v2-cross-period-nayuta.test.mjs','utf8');
          const helper=readFileSync('tests/support/p3-genuine-v2-player.mjs','utf8');
          const swap=(s,a,b)=>{if(s.split(a).length!==2)throw Error('nonunique diagnostic anchor');return s.replace(a,b);};
          const observed=swap(helper,
            "const command=async(route,body)=>ok(await post(route,{expectedRevision:state.world.revision,...body}));",
            "const command=async(route,body)=>{const before=state; const r=await post(route,{expectedRevision:state.world.revision,...body}); const snapshot=s=>({revision:s?.world?.revision,clock:s?.world?.nowSeconds,period:s?.world?.period?.settledCount,activeEvents:s?.world?.period?.eventState,shop:s?.shop&&Object.fromEntries(['id','status','showcasecount','showcase','price','item','time','job','money','exp','rank','trush','costtoday','paytoday','saletoday','taxtoday','taxmode'].map(k=>[k,s.shop[k]])),history:s?.historyCommands,generation:s?.save?.generation}); t.diagnostic('P3_NAYUTA_AUDIT '+JSON.stringify({route,body,code:r.code,reason:r.details?.reason,before:snapshot(before),after:snapshot(state),worldUnchanged:JSON.stringify(before.world)===JSON.stringify(state.world)})); return ok(r);};");
          writeFileSync('tests/support/p3-audit-nayuta-player.mjs',observed,{flag:'wx'});
          writeFileSync('tests/p3-audit-nayuta-observation.mjs',swap(test,"./support/p3-genuine-v2-player.mjs","./support/p3-audit-nayuta-player.mjs"),{flag:'wx'});
          NODE
          git diff --no-index -- tests/p3-v2-cross-period-nayuta.test.mjs "$testcopy" >"$out/test-copy.diff" || test "$?" = 1
          git diff --no-index -- tests/support/p3-genuine-v2-player.mjs "$helpercopy" >"$out/helper-copy.diff" || test "$?" = 1
          cat "$out/test-copy.diff" "$out/helper-copy.diff"
          set +e
          node --test "$testcopy" >"$out/observation.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" | tee "$out/observation-exit.txt"
          grep -E 'P3_NAYUTA_AUDIT|SOURCE_BOUNDARY_REJECTED|^not ok|^ok |^# (tests|pass|fail|skipped|cancelled)|P3 #66/3|P3 #70' "$out/observation.log" || true
          rm -f "$testcopy" "$helpercopy"
          trap - EXIT
          test -z "$(git status --porcelain)"
          exit "$status"
      - name: Preserve original and diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-nayuta-boundary-d35
          path: ${{ runner.temp }}/p3-nayuta/
          if-no-files-found: warn
          retention-days: 30

  high-forge-d30-original:
    if: ${{ github.event.number == 26 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/r0-r1-unified-audit-20261126' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact D30 failed candidate
        uses: actions/checkout@v4
        with:
          ref: '90858aa6394b7828b7b37ee6262b1ad04394e5b7'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate and untouched tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/d30-forge"
          mkdir -p "$out"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            perl -v
            test "$(git rev-parse HEAD)" = '90858aa6394b7828b7b37ee6262b1ad04394e5b7'
            test "$(git rev-parse 'HEAD^{tree}')" = '7cd012e4289f01c7ee6a5b1eff4d110c980c9129'
            test "$(git hash-object modern/tests/p3-v2-high-forge-66.test.mjs)" = 'ae6f58c0a212c544504128d6c9c5172b6d8ea932'
            test "$(git hash-object modern/tests/support/p3-genuine-v2-player.mjs)" = '5cf787e6fefadaddeef48bd7d965dc4fca342df6'
            test "$(git hash-object modern/tests/support/p3-high-forge.mjs)" = '187b03899bd092dfa2935d13a81dedf10d103c87'
            test -z "$(git status --porcelain)"
          } 2>&1 | tee "$out/environment.log"
      - name: Run original unchanged test
        id: original
        working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/d30-forge"
          set +e
          node --test tests/p3-v2-high-forge-66.test.mjs >"$out/original.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" | tee "$out/original-exit.txt"
          cat "$out/original.log"
          exit "$status"
      - name: Preserve unchanged original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-forge-d30-exact
          path: ${{ runner.temp }}/d30-forge/
          if-no-files-found: warn
          retention-days: 30
