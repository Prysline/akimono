name: Verify modernization sources and original Perl baseline

on:
  push:
    branches:
      - test/task02-baseline-on-s1
  pull_request:
    paths:
      - 'modern/**'
      - 'custom/inc-item-data.cgi'
      - 'custom/inc-rebel-data.cgi'
      - '.github/workflows/verify-modernization.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Standard Street DSL source audit
        working-directory: modern
        run: |
          npm test
          npm run audit
          npm run demo:state
          npm run demo:economy
          npm run demo:peer
          npm run demo:limits
          npm run demo:wholesale
          npm run demo:turn-wholesale
          npm run demo:world
          npm run demo:commit
          npm run demo:lock
          npm run demo:backup
          npm run demo:read-preflight
      - name: Verify pinned original Core source blobs
        run: |
          test "$(git hash-object modern/tests/original-perl/calc.cgi)" = "586354a9a300e26d0e12a4efa512fa25760e3197"
          test "$(git hash-object modern/tests/original-perl/item.cgi)" = "b39400d7dc0ab80062c392ae2bbc923e24ecacf8"
          test "$(git hash-object modern/tests/original-perl/new.cgi)" = "9f0a590a6f1d4e93d2534056a0dc96c4d5c80ba7"
          test "$(git hash-object modern/tests/original-perl/sc-s.cgi)" = "0bada620cff769bed782707d61b87e48cce0a58c"
          test "$(git hash-object modern/tests/original-perl/market.cgi)" = "1aca77e9b373c25e53e445d64c101a7cc2246825"
          test "$(git hash-object modern/tests/original-perl/whole.cgi)" = "778badaf157326bcfd1f8fa1e310d94f94995eb3"
          test "$(git hash-object modern/tests/original-perl/buy-s.cgi)" = "6ba8df9a733ed16c490389414cd94934fe1185ca"
          test "$(git hash-object modern/tests/original-perl/inc-makeitem.cgi)" = "1da8cce1e76ad6159325a37faec68efaa82c7f69"
          test "$(git hash-object modern/tests/original-perl/inc-turn.cgi)" = "b8a4980275f475a952846a8d6072fad45f8dff50"
          test "$(git hash-object modern/tests/original-perl/inc-func.cgi)" = "e7a8add7b0291901e71fe797783b664dff1568a0"
          test "$(git hash-object modern/tests/original-perl/write.cgi)" = "203f33b37511e838800a45b84183af98fcf46e4c"
          test "$(git hash-object modern/tests/original-perl/lock.cgi)" = "84382170f1b7f70348c4e2a91bf30b1d1043b964"
      - name: Run isolated original Perl Core tests
        working-directory: modern/tests/original-perl
        run: prove -v *.t
